# Mobile base configuration for the SGS demo (see launch/sgs_demo.launch.py).
#
# tmrv0_2.launch.py reads only the first entry of this file, so there is exactly one.
# The base gets its own namespace and therefore its own controller_manager, separate from
# the two arms.
#
# Note: This is a launch configuration file, not a node parameter file (see controllers.yaml).
# Boolean values must be quoted to avoid YAML parsing issues.

BASE:
  robot_type: "tmrv0_2"
  arm_prefix: ""
  fake_sensor_commands: "false"
  joint_state_rate: 30
  load_gripper: "false"
  namespace: "base"
  robot_ip: "172.16.16.10"
  use_fake_hardware: "false"
  use_rviz: "false" # No broadcasters run in this demo, so there is nothing for RViz to show.
